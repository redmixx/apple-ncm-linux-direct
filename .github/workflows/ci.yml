name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Verify repository
        run: ./scripts/verify-repo.sh
      - name: Exercise read-only help paths
        run: |
          ./scripts/diagnose.sh
          ./scripts/check-kernel-support.sh --help
          ./scripts/build-cdc-ncm.sh --help
          ./scripts/check-module.sh --help
          ./scripts/configure-link-linux.sh --help
          ./scripts/test-link.sh --help
          ./scripts/rollback.sh --help
      - name: Exercise argument paths
        run: |
          out=$(./scripts/check-kernel-support.sh --product 1905 2>/dev/null || true)
          printf '%s\n' "$out"
          # The runner kernel has no cdc_ncm in modules.dep; 'REASON: modinfo
          # could not inspect cdc_ncm' proves the --product path ran to the
          # modinfo stage on this bash (no 'bad substitution').
          { grep -q "REASON: modinfo could not inspect" <<<"$out" &&
            ! grep -qi "bad substitution" <<<"$out"; } || exit 1
          if ./scripts/rollback.sh --interface does-not-exist0 --linux-address 10.55.0.2/30 --apply 2>err.log; then
            echo "FAIL: non-root --apply unexpectedly succeeded"; exit 1
          fi
          case "$?" in
            77) echo "root gate hit (exit 77); interface guard verified locally on bash 3.2" ;;
            65) grep -q "does not exist" err.log ;;
            *) echo "FAIL: unexpected rollback exit"; cat err.log; exit 1 ;;
          esac
          if ./scripts/configure-link-linux.sh --interface -la --linux-address 10.55.0.2/30 2>/dev/null; then
            echo "FAIL: unsafe interface name accepted"
            exit 1
          fi
